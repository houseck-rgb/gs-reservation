<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>고기야 예약수첩</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14213d;--navy2:#1f3160;--gold:#c9a24b;--gold2:#f3e7c7;--bg:#f5f3ee;--card:#fff;
  --ink:#1b1f2a;--sub:#6b7280;--line:#e5e1d8;--red:#c0392b;--green:#2e7d4f;--rail:108px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px}
button,input,textarea,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
header h1{margin:0;font-size:16px;font-weight:900;letter-spacing:-.3px;flex:1}
header h1 small{display:block;font-size:11px;font-weight:500;color:var(--gold);letter-spacing:0}
.hbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700}
.hbtn.gold{background:var(--gold);color:var(--navy)}

.wrap{display:flex;align-items:flex-start;min-height:calc(100vh - 56px)}
/* 왼쪽 목차 */
aside{position:sticky;top:56px;width:var(--rail);flex:none;height:calc(100vh - 56px);overflow-y:auto;background:var(--navy2);color:#fff;padding:8px 6px 80px}
.newbtn{width:100%;border:0;border-radius:10px;background:var(--gold);color:var(--navy);font-weight:900;padding:10px 4px;font-size:13px;margin-bottom:8px}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:8px;padding:2px;margin-bottom:8px}
.seg button{flex:1;border:0;background:none;color:#cfd6e6;font-size:11px;padding:5px 0;border-radius:6px;font-weight:700}
.seg button.on{background:#fff;color:var(--navy)}
.gh{font-size:11px;font-weight:900;color:var(--gold);margin:10px 2px 4px;display:flex;justify-content:space-between}
.gh.today{color:#fff}
.gh span{color:#9fb0d0;font-weight:500}
.ti{width:100%;text-align:left;border:0;background:rgba(255,255,255,.07);border-radius:9px;padding:7px 7px;margin-bottom:5px;color:#fff;border-left:3px solid transparent}
.ti.on{background:#fff;color:var(--navy);border-left-color:var(--gold)}
.ti .t{font-size:11px;color:var(--gold);font-weight:700}
.ti.on .t{color:#9a7a2e}
.ti .n{font-size:13px;font-weight:700;line-height:1.25;word-break:keep-all;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ti .m{font-size:11px;opacity:.75;margin-top:2px}
.ti .u{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff8a7a;margin-left:3px;vertical-align:middle}
.empty{font-size:12px;color:#9fb0d0;text-align:center;padding:20px 4px;line-height:1.5}

main{flex:1;min-width:0;padding:10px 10px 120px}
.card{background:var(--card);border-radius:16px;border:1px solid var(--line);padding:12px;margin-bottom:10px}
.sec{display:flex;align-items:center;gap:6px;margin:0 0 10px;font-size:14px;font-weight:900}
.sec i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--navy);color:var(--gold);font-size:11px;display:grid;place-items:center;flex:none}
.sec .r{margin-left:auto;font-size:12px;font-weight:500;color:var(--sub)}
.editing{display:none;background:var(--gold2);color:#6b5414;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;margin-bottom:10px;align-items:center;gap:6px}
.editing.show{display:flex}
.editing button{margin-left:auto;border:0;background:#fff;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700}

/* 달력 */
.calh{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.calh b{flex:1;font-size:15px}
.calh button{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:32px;height:30px;font-weight:700}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow div{text-align:center;font-size:11px;color:var(--sub);padding:2px 0}
.dow div:first-child,.d.sun .dn{color:var(--red)}
.dow div:last-child,.d.sat .dn{color:#2f5fb3}
.d{border:0;background:#faf9f6;border-radius:8px;height:42px;padding:3px 0 0;position:relative;display:flex;flex-direction:column;align-items:center}
.d.out{visibility:hidden}
.d .dn{font-size:13px;font-weight:700}
.d .c{font-size:10px;font-weight:900;color:var(--navy);background:var(--gold2);border-radius:6px;padding:0 4px;margin-top:2px}
.d.has{background:#fbf5e6}
.d.today{box-shadow:inset 0 0 0 2.5px #22a35a}
.d.sel{background:var(--navy)}
.d.sel.today{box-shadow:inset 0 0 0 2.5px #3ddc84}
.d.sel .dn{color:#fff!important}
.d.past .dn{opacity:.4}
.selline{margin-top:8px;font-size:13px;color:var(--sub)}
.selline b{color:var(--navy)}

/* 입력 */
.row{display:flex;gap:8px;margin-bottom:8px}
.row>*{flex:1;min-width:0}
label.f{display:block;font-size:12px;color:var(--sub);font-weight:500;margin-bottom:4px}
.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;font-size:15px;outline:none}
.in:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.18)}
textarea.in{resize:vertical;min-height:62px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.hint{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}

/* 문자 */
.tpls{display:flex;gap:6px;margin-bottom:8px}
.tpls .chip{flex:1;text-align:center;padding:7px 4px}
.preview{white-space:pre-wrap;background:#f1f6ff;border:1px solid #d9e5fb;border-radius:12px;padding:10px;font-size:13.5px;line-height:1.6;min-height:80px}
.autobar{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#cfcfcf;border-radius:99px;transition:.2s}
.sw span:before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--green)}
.sw input:checked+span:before{transform:translateX(18px)}
.cd{display:none;margin-top:8px;background:var(--navy);color:#fff;border-radius:12px;padding:10px 12px;align-items:center;gap:8px;font-size:14px;font-weight:700}
.cd.show{display:flex}
.cd b{color:var(--gold);font-size:18px}
.cd button{margin-left:auto;border:0;background:#fff;color:var(--navy);border-radius:8px;padding:6px 12px;font-weight:900}

/* 배치도 */
.floor{position:relative;width:100%;aspect-ratio:1035/1560;background:#efe8db;border-radius:14px;container-type:inline-size;overflow:hidden}
.fp{position:absolute}
.fp.sofa{background:#b8892c;border-radius:9px}
.fp.win{border-left:2px solid #6f95cf;border-right:2px solid #6f95cf}
.fp.lbl{font-weight:900;font-size:3.6cqw;line-height:1.15;text-align:center;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.3cqw}
.fp.tag{background:var(--navy);color:#fff;border-radius:1.6cqw;font-weight:900;font-size:3.6cqw;display:flex;align-items:center;justify-content:center;gap:1cqw}
.fp.salad{background:#e3eed4;border:.4cqw solid #8fb36a;border-radius:2cqw;color:#3f6b22;font-weight:900;font-size:4cqw;display:flex;align-items:center;justify-content:center;gap:1.4cqw}
.tbl{position:absolute;border:.5cqw solid #dfd3b8;background:#fff;border-radius:2.4cqw;font-weight:900;font-size:7cqw;color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding:0 .6cqw;box-shadow:0 .3cqw .8cqw rgba(0,0,0,.06)}
.tbl small{font-size:2.5cqw;font-weight:700;color:var(--sub);max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tbl.on{background:#b8892c;border-color:#b8892c;color:#fff}
.tbl.on small{color:#fff}
.tbl.taken{background:#e4e0d8;border-style:dashed;color:#a8a296}
.tbl.taken small.tt{font-size:2.8cqw;font-weight:900;color:#5a5346;background:#fff;border-radius:1cqw;padding:0 .4cqw;margin-top:.3cqw;max-width:none;overflow:visible;text-overflow:clip;letter-spacing:-.1cqw}
.chair{position:absolute;background:#d8cbae;border-radius:1.4cqw;pointer-events:none;box-shadow:inset 0 -.4cqw 0 rgba(0,0,0,.08)}
.chair.on{background:#e0b552}
.chair.sofa{background:#c9a35a;border-radius:1cqw}
.chair.sofa.on{background:#e8c062}
.tl{display:none;background:var(--navy);color:#fff;border-radius:14px;padding:10px 6px;margin-bottom:10px;gap:4px}
.tl.show{display:flex}
.tl div{flex:1;text-align:center;border-right:1px solid rgba(255,255,255,.15)}
.tl div:last-child{border:0}
.tl span{display:flex;align-items:center;justify-content:center;min-height:2.7em;line-height:1.3;font-size:11px;color:#c9d2e6;font-weight:500;padding:0 2px;word-break:keep-all}
.tl b{display:block;font-size:19px;font-weight:900;color:var(--gold);letter-spacing:-.5px}
.tl div.arr b{color:#fff}
.tm{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tm label{width:92px;flex:none;font-size:13px;font-weight:900}
.tm input{flex:1;min-width:0}
.tmchips{display:flex;gap:5px;margin:-2px 0 10px 100px;flex-wrap:wrap}
.tmchips .chip{padding:4px 9px;font-size:12px}
.ti .k{font-size:10.5px;color:#ffd9a0;margin-top:2px}
.ti.on .k{color:#9a6a12}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;vertical-align:middle;background:#9aa}
body.view #btnTpl,body.view .actions,body.view #smsCard,body.view #btnNew,body.view #btnCancelEdit{display:none!important}
body.view main input,body.view main textarea{background:#f7f5f0;pointer-events:none}
body.view .tbl,body.view .chip{pointer-events:none}
body.view main{padding-bottom:40px}
#tsBox{margin-top:10px}
#tsBox .tsh{display:flex;justify-content:space-between;font-size:12.5px;font-weight:900;margin-bottom:4px}
#tsBox .tsh .ok{color:var(--green)}#tsBox .tsh .bad{color:var(--red)}
.tsrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed #eee}
.tsrow .no{flex:1;font-size:15px;font-weight:900;color:var(--navy)}
.tsrow .no small{font-size:11px;color:var(--sub);font-weight:500;margin-left:4px}
.tl2{display:none;background:#fff6e2;border:1px solid #ecd9a8;border-radius:12px;padding:8px 12px;margin:-4px 0 10px;font-size:13.5px;line-height:1.7}
.tl2.show{display:block}
.tl2 b{color:#8d6516;font-weight:900}
.po{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fffdf8}
.po h4{margin:0 0 8px;font-size:14px;font-weight:900;display:flex;align-items:center;gap:6px}
.po h4 span{margin-left:auto;font-size:12px;color:#8d6516;font-weight:900}
.po .tm label{width:70px}
.po .pochips{display:flex;gap:5px;margin:-2px 0 6px;flex-wrap:wrap}
.po .pochips .chip{padding:4px 9px;font-size:12px}
.pogrp{font-size:11px;color:var(--sub);font-weight:700;margin:8px 0 2px}
.poitem{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dashed #eee}
.poitem .nm{flex:1;font-size:14px;font-weight:700;color:#555}
.poitem.has .nm{color:var(--navy)}
.stp{display:flex;align-items:center;gap:4px}
.stp button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:900;line-height:1}
.stp b{min-width:46px;text-align:center;font-size:14px;color:#aaa}
.poitem.has .stp b{color:#b8892c;font-size:15px}
body.view .stp button,body.view .pochips{display:none}
body.view .poitem.zero{display:none}
.setimg{max-height:62vh;overflow-y:auto;border-radius:12px;border:1px solid var(--line);background:#faf8f3}
.setimg img{width:100%;display:block}
.setbtn{width:100%;margin-top:10px;border:1.5px solid var(--gold);background:#fffaf0;color:#7a5d17;border-radius:12px;padding:11px;font-weight:900;font-size:14px}
.need{font-weight:700;color:var(--navy)}
.need.ok{color:var(--green)}
.need.short{color:var(--red)}

/* 하단 버튼 */
.actions{position:fixed;left:var(--rail);right:0;bottom:0;z-index:15;background:rgba(245,243,238,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:6px}
.btn{border:0;border-radius:12px;padding:13px 8px;font-weight:900;font-size:14px;text-align:center;text-decoration:none;flex:1;display:flex;align-items:center;justify-content:center;gap:4px}
body.typing .actions{display:none}
.btn.sms{background:var(--gold);color:var(--navy);flex:1.6}
.btn.save{background:var(--navy);color:#fff}
.btn.done{background:#fff;border:1.5px solid var(--red);color:var(--red);flex:.9;display:none}
.btn.done.show{display:flex}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);font-size:12px;padding:7px 10px;flex:none;border-radius:9px}

/* 모달/토스트 */
.mask{position:fixed;inset:0;background:rgba(10,15,30,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.modal{position:relative;max-height:94vh;overflow-y:auto}
.modal h3{margin:0 0 8px;font-size:16px;padding-right:44px}
.mx{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:#efebe2;color:var(--navy);font-size:24px;font-weight:700;line-height:1;display:grid;place-items:center;z-index:2}
.modal p{margin:0 0 12px;color:var(--sub);font-size:14px;line-height:1.5}
.modal .mrow{display:flex;gap:8px;margin-top:12px}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:60;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

@media(min-width:720px){
  :root{--rail:250px}
  aside{padding:12px 10px 80px}
  .ti .n{font-size:14px}
  main{padding:16px 18px 120px;max-width:760px}
}
</style>
</head>
<body>
<header>
  <img src="icon-192.png" alt="" width="38" height="38" style="border-radius:10px"><h1>예약수첩<small><span class="dot" id="statusDot"></span><span id="statusTxt">이 휴대폰에 저장</span></small></h1>
  <button class="hbtn gold" id="installApp" hidden>설치</button>
  <button class="hbtn" id="btnAdmin" hidden>🔒</button>
  <button class="hbtn" id="btnTpl">문구</button>
  <button class="hbtn" id="btnSetHead">세팅</button>
  <button class="hbtn gold" id="btnShare">공유</button>
</header>

<div class="wrap">
  <aside>
    <button class="newbtn" id="btnNew">＋ 신규</button>
    <div class="seg"><button class="on" data-f="up">다가올</button><button data-f="past">지난</button></div>
    <div id="toc"></div>
  </aside>

  <main>
    <div class="editing" id="editBar"><span id="editName"></span><button id="btnCancelEdit">새로 입력</button></div>
    <div class="tl" id="tl"></div>
    <div class="tl2" id="tl2"></div>

    <!-- 1 달력 -->
    <div class="card">
      <div class="sec"><i>1</i>예약 날짜</div>
      <div class="calh">
        <button id="prevM">‹</button><b id="calTitle"></b>
        <button id="todayM" style="padding:0 8px;font-size:12px">오늘</button><button id="nextM">›</button>
      </div>
      <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
      <div class="days" id="days"></div>
      <div class="selline" id="selLine"></div>
    </div>

    <!-- 2 인적사항 -->
    <div class="card">
      <div class="sec"><i>2</i>인적사항</div>
      <div class="row">
        <div><label class="f">단체명 / 예약자</label><input class="in" id="fName" placeholder="예) 삼성전자"></div>
      </div>
      <div class="row">
        <div style="flex:.8"><label class="f">인원</label><input class="in" id="fPax" inputmode="numeric" placeholder="명"></div>
        <div style="flex:1"><label class="f">시간</label><input class="in" id="fTime" type="time"></div>
      </div>
      <div class="chips" id="timeChips" style="margin-bottom:10px"></div>
      <div><label class="f">연락처 <span style="color:var(--gold)">— 입력 끝나면 문자 자동 작성</span></label><input class="in" id="fPhone" inputmode="tel" placeholder="010-0000-0000"></div>
    </div>

    <!-- 3 문자 -->
    <div class="card" id="smsCard">
      <div class="sec"><i>3</i>문자 자동입력<span class="r" id="sentState"></span></div>
      <div class="tpls" id="tplTabs"></div>
      <div class="preview" id="preview"></div>
      <div class="autobar">
        <label class="sw"><input type="checkbox" id="imgOn"><span></span></label>
        <span>✔️ 테이블 위치 이미지 함께 보내기</span>
      </div>
      <div class="autobar">
        <label class="sw"><input type="checkbox" id="autoOn"><span></span></label>
        <span>연락처 입력 완료 시 문자앱 자동 열기</span>
      </div>
      <div class="cd" id="cdBar">📩 <b id="cdNum">3</b>초 후 문자앱이 열려요<button id="cdCancel">취소</button></div>
    </div>

    <!-- 4 테이블 -->
    <div class="card">
      <div class="sec"><i>4</i>테이블 지정<span class="r" id="needTxt"></span></div>
      <div class="floor" id="cols"></div>
      <div id="tsBox"></div>
      <button class="setbtn" id="btnFloorShare">📢 테이블 배치 이미지 직원에게 공유</button>
      <div class="hint">테이블당 의자 4석 · 금색은 선택한 자리(앉는 인원만큼 의자 표시) · 회색 점선은 같은 날 다른 예약이 잡힌 자리</div>
    </div>

    <!-- 5 상차림 -->
    <div class="card">
      <div class="sec"><i>5</i>상차림 방법</div>
      <div class="tm"><label>⏰ 상차림 완료</label><input class="in" id="fSetT" type="time"></div>
      <div class="tmchips" data-for="fSetT"><button class="chip" data-o="60">1시간 전</button><button class="chip" data-o="30">30분 전</button><button class="chip" data-o="20">20분 전</button></div>
      <div class="tm"><label>🧾 주방 오더</label><input class="in" id="fRcpT" type="time"></div>
      <div class="tmchips" data-for="fRcpT"><button class="chip" data-o="20">20분 전</button><button class="chip" data-o="10">10분 전</button><button class="chip" data-o="0">도착 시</button></div>
      <div id="poBox"></div>
      <div class="chips" id="setChips"></div>
      <div class="row" style="margin-top:10px;margin-bottom:0">

function stopCd(){clearInterval(cdTimer);cdTimer=null;$('cdBar').classList.remove('show')}
function startCd(){
  stopCd();let n=3;$('cdNum').textContent=n;$('cdBar').classList.add('show');
  cdTimer=setInterval(()=>{n--;$('cdNum').textContent=n;if(n<=0){stopCd();sendSms(true)}},1000);

function missing(f){const m=[];if(!f.name)m.push('단체명');if(!f.pax)m.push('인원');if(!f.time)m.push('시간');return m}
let imgOn=load(IKEY,true);
$('imgOn').checked=imgOn;
$('imgOn').onchange=e=>{imgOn=e.target.checked;save(IKEY,imgOn)};
const withImg=f=>imgOn&&f.tables.length>0;
function sendSms(auto){
  const f=form();
  if(!phoneDone(f.phone)){toast('연락처를 확인해주세요');return false}
  const ms=missing(f);if(ms.length){toast(ms.join('·')+' 먼저 입력해주세요');return false}
  upsert(true);
  const href=smsHref(f.phone,renderMsg(tpls[curTpl].text,f));
  if(auto)location.href=href;
  return true;
}
async function sendSmsWithImage(){
  const f=form(),body=renderMsg(tpls[curTpl].text,f),href=smsHref(f.phone,body);
  if(!phoneDone(f.phone)){toast('연락처를 확인해주세요');return}
  const ms=missing(f);if(ms.length){toast(ms.join('·')+' 먼저 입력해주세요');return}
  try{await navigator.clipboard.writeText(digits(f.phone))}catch(e){}
  const cv=buildFloorImage(f);
  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
  const file=new File([blob],`좌석안내_${f.name}.png`.replace(/\s+/g,''),{type:'image/png'});
  upsert(true);
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    toast('문자 앱 선택 → 받는 사람에 번호 붙여넣기');
    try{await navigator.share({files:[file],text:body})}catch(e){}
    return;
  }
  // 공유창이 없는 화면(앱 미리보기 등): 다운로드 대신 이미지를 띄우고 문자앱 버튼 제공
  fallbackModal('📩 좌석 이미지와 함께 보내기',[cv.toDataURL('image/png')],
    '① 이미지를 <b>길게 눌러 저장</b> ② 아래 버튼으로 문자앱을 열고 사진 첨부',
    `<a class="btn sms" style="flex:1" href="${href}">📩 문자앱 열기</a>`);
}
/* 연락처 입력이 끝나면 바로 뜨는 한 번 누르기 창 (휴대폰은 이미지 공유에 손가락 터치가 꼭 필요) */

  <div class="preview" style="max-height:30vh;overflow-y:auto;margin-bottom:4px">${esc(renderMsg(tpls[curTpl].text,f))}</div>
  <div class="mrow"><button class="btn sms" style="flex:1;padding:16px;font-size:16px" id="qsGo">📩 지금 보내기 (이미지 포함)</button></div>`,(m,close)=>{
    m.querySelector('#qsGo').onclick=()=>{close();sendSmsWithImage()};

/* 공유창이 없을 때 쓰는 대체 창: 이미지 미리보기 + 길게 눌러 저장 안내 */
function fallbackModal(title,urls,guide,btnHTML,text){
  modal(`<h3>${title}</h3><p style="font-size:13px">이 화면에서는 휴대폰 공유창을 쓸 수 없어요.<br>${guide}</p>
  <div class="setimg" style="max-height:48vh">${urls.map(u=>`<img src="${u}" alt="공유 이미지" style="margin-bottom:6px">`).join('')}</div>
  <div class="mrow">${text?'<button class="btn ghost" style="flex:1;padding:12px" id="fbCopy">글 복사</button>':''}${btnHTML||''}</div>`,(m,close)=>{
    const c=m.querySelector('#fbCopy');
    if(c)c.onclick=async()=>{try{await navigator.clipboard.writeText(text);toast('글을 복사했어요')}catch(e){toast('복사가 안 되는 화면이에요')}};
  });
}

/* 손님용 좌석 안내 이미지 */
function buildFloorImage(f,staff){
  const W=1035,TOP=250,H=TOP+1560+90+(staff?60:0),cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const c=cv.getContext('2d');c.fillStyle='#fbf8f2';c.fillRect(0,0,W,H);
  const tables=f.tables.slice().sort((a,b)=>a-b);
  // 직원용: 같은 날 다른 예약 자리도 표시
  const others={};
  if(staff)list.forEach(r=>{if(r.date===f.date&&r.id!==(f.id||editingId))(r.tables||[]).forEach(t=>others[t]={name:r.name,time:r.time})});
  c.textAlign='center';c.fillStyle=NAVY;c.font='900 58px "Noto Sans KR"';c.fillText(staff?`[직원] ${f.name||''} 테이블 배치`:`${f.name||''} 예약 좌석`,W/2,82);
  c.fillStyle='#555';c.font='700 32px "Noto Sans KR"';c.fillText(`${fmtDate(f.date)} ${fmtTime(f.time)} · ${f.pax}명`,W/2,134);
  const chip=tables.map(t=>t+'번').join(' · ')+' 테이블';c.font='900 36px "Noto Sans KR"';
  const cw=Math.min(W-80,c.measureText(chip).width+90);rr(c,(W-cw)/2,160,cw,68,22);c.fillStyle='#b8892c';c.fill();c.fillStyle='#fff';c.fillText(chip,W/2,207);
  c.save();c.translate(0,TOP);
  rr(c,20,0,W-40,1560,36);c.fillStyle='#efe8db';c.fill();
  const tag=(x,y,w,h,t)=>{rr(c,x,y,w,h,14);c.fillStyle=NAVY;c.fill();c.fillStyle='#fff';c.font='900 34px "Noto Sans KR"';c.fillText(t,x+w/2,y+h/2+12)};
  tag(808,38,186,58,'계산대 ▸');tag(818,1450,176,58,'입구');
  rr(c,84,122,18,1278,9);c.fillStyle='#b8892c';c.fill();
  c.fillStyle='#6f95cf';c.fillRect(952,690,3,450);c.fillRect(959,690,3,450);
  c.font='900 34px "Noto Sans KR"';
  [['벽',700],['소',740],['파',780]].forEach(([t,y])=>{c.fillStyle='#b8892c';c.fillText(t,52,y)});
  [['창',900],['가',940]].forEach(([t,y])=>{c.fillStyle='#4f7cc0';c.fillText(t,993,y)});
  rr(c,125,1428,562,96,20);c.fillStyle='#e3eed4';c.fill();c.lineWidth=4;c.strokeStyle='#8fb36a';c.stroke();
  c.fillStyle='#3f6b22';c.font='900 40px "Noto Sans KR"';c.fillText('샐러드바',406,1490);
  Object.keys(TPOS).forEach(k=>{
    const on=tables.includes(+k),used=on?Math.min(4,(f.tseats&&f.tseats[k])||4):0;
    chairsOf(+k).forEach(([x,y,w,h,s],i)=>{rr(c,x,y,w,h,8);c.fillStyle=i<used?'#e0b552':(s?'#c9a35a':'#d8cbae');c.fill()});
  });
  Object.keys(TPOS).forEach(k=>{
    const [x,y,w,h]=TPOS[k],on=tables.includes(+k),oth=!on&&others[k];
    rr(c,x,y,w,h,24);c.fillStyle=on?'#b8892c':oth?'#e4e0d8':'#fff';c.fill();c.lineWidth=5;c.strokeStyle=on?'#8d6516':oth?'#b0a898':'#dfd3b8';
    if(oth){c.save();c.setLineDash([14,10]);c.stroke();c.restore()}else c.stroke();
    c.fillStyle=on?'#fff':oth?'#8a8478':'#9aa3b5';c.font=`900 ${on?76:oth?54:64}px "Noto Sans KR"`;c.fillText(k,x+w/2,y+h/2+(on?14:oth?-2:22));
    if(on){c.font='900 26px "Noto Sans KR"';c.fillText(f.tseats&&f.tseats[k]?`${f.tseats[k]}명`:'예약석',x+w/2,y+h/2+52)}
    if(oth){
      const o=others[k];c.font='700 22px "Noto Sans KR"';let s=o.name;while(c.measureText(s).width>w-12&&s.length>1)s=s.slice(0,-1);
      c.fillText(s===o.name?s:s+'…',x+w/2,y+h/2+30);
      const tt=o.time?fmtHM(o.time):'시간 미정';c.font='900 26px "Noto Sans KR"';const tw=c.measureText(tt).width+20;
      rr(c,x+w/2-tw/2,y+h/2+40,tw,34,10);c.fillStyle='#fff';c.fill();c.fillStyle='#5a5346';c.fillText(tt,x+w/2,y+h/2+67);
    }
  });
  c.restore();
  if(staff){
    c.font='700 28px "Noto Sans KR"';c.fillStyle='#555';
    c.fillText(`금색 = 이번 예약 · 회색 점선 = 같은 날 다른 예약 · ⏰${fmtHM(f.setT)} 🧾${fmtHM(f.rcpT)}`,W/2,H-90);
  }
  c.fillStyle='#8a8a8a';c.font='700 28px "Noto Sans KR"';c.fillText('최우영고기야',W/2,H-34);
  return cv;
}

// 같은 날 다른 예약 자리: 테이블 → {이름, 시간}
function takenMap(){const m={};list.forEach(r=>{if(r.date===selDate&&r.id!==editingId)r.tables.forEach(t=>m[t]={name:r.name,time:r.time})});return m}
const FW=1035,FH=1560;
const fpos=(x,y,w,h)=>`left:${x/FW*100}%;top:${y/FH*100}%;width:${w/FW*100}%;height:${h/FH*100}%`;
const DECOR=
  `<div class="fp tag" style="${fpos(808,38,186,58)}">계산대 ▸</div>`+
  `<div class="fp sofa" style="${fpos(84,122,18,1278)}"></div>`+
  `<div class="fp lbl" style="${fpos(30,660,46,200)};color:#b8892c">벽소파</div>`+
  `<div class="fp win" style="${fpos(952,690,10,450)}"></div>`+
  `<div class="fp lbl" style="${fpos(968,835,56,160)};color:#4f7cc0">창가</div>`+
  `<div class="fp salad" style="${fpos(125,1428,562,96)}">🥗 샐러드바</div>`+

/* 테이블별 인원 — 예약 인원으로 자동 배분, 직접 고치면 그 값 유지 */
let tseats={}, tsManual=false;
function autoSeats(){
  if(tsManual)return;
  const s=picked.slice().sort((a,b)=>a-b),pax=+$('fPax').value||0,arr=seatsFor(s,pax);
  tseats={};s.forEach((t,i)=>tseats[t]=pax?arr[i]:4);
}
const seatSum=()=>picked.reduce((a,t)=>a+(tseats[t]||0),0);
function drawSeats(){
  const s=picked.slice().sort((a,b)=>a-b),box=$('tsBox');
  if(!s.length){box.innerHTML='';return}
  const pax=+$('fPax').value||0,sum=seatSum();
  box.innerHTML=`<div class="tsh"><span>테이블별 인원</span><span class="${!pax||sum===pax?'ok':'bad'}">배정 ${sum}명${pax?' / 예약 '+pax+'명':''}</span></div>`+
    s.map(t=>`<div class="tsrow"><span class="no">${t}번<small>${t>=12?'세로 · 벽소파':'가로'}</small></span><span class="stp"><button data-ts="${t}" data-d="-1">−</button><b style="color:#b8892c">${tseats[t]||0}명</b><button data-ts="${t}" data-d="1">＋</button></span></div>`).join('')+
    (tsManual?`<div class="hint" style="text-align:right"><button class="chip" id="tsAuto">인원 다시 자동 배분</button></div>`:'');
}
$('tsBox').onclick=e=>{
  if(!isAdmin)return;
  if(e.target.id==='tsAuto'){tsManual=false;autoSeats();drawFloor();drawTimeline();return}
  const b=e.target.closest('[data-ts]');if(!b)return;const t=+b.dataset.ts;
  tseats[t]=Math.max(0,Math.min(8,(tseats[t]||0)+ +b.dataset.d));tsManual=true;drawFloor();

// 테이블당 의자 4석 위치 [x,y,가로,세로,소파여부] — 순서는 세팅표 자리 순서와 같음
function chairsOf(n){
  const [x,y,w,h]=TPOS[n];
  if(n>=12){const ch=h*.3;return[[x-21,y+h*.25-ch/2,16,ch,1],[x+w+5,y+h*.25-ch/2,22,ch,0],[x-21,y+h*.75-ch/2,16,ch,1],[x+w+5,y+h*.75-ch/2,22,ch,0]]}
  const cw=w*.3,ch=22;
  return[[x+w*.25-cw/2,y+h+6,cw,ch,0],[x+w*.75-cw/2,y+h+6,cw,ch,0],[x+w*.25-cw/2,y-6-ch,cw,ch,0],[x+w*.75-cw/2,y-6-ch,cw,ch,0]];
}
function drawFloor(){
  const tk=takenMap();
  const chairs=Object.keys(TPOS).map(k=>{const n=+k,on=picked.includes(n),used=on?Math.min(4,tseats[n]||0):0;
    return chairsOf(n).map(([x,y,w,h,s],i)=>`<div class="chair${s?' sofa':''}${i<used?' on':''}" style="${fpos(x,y,w,h)}"></div>`).join('')}).join('');
  $('cols').innerHTML=DECOR+chairs+Object.keys(TPOS).map(k=>{
    const n=+k,[x,y,w,h]=TPOS[k],on=picked.includes(n),t=tk[n]&&!on;
    return `<button class="tbl${on?' on':''}${t?' taken':''}" style="${fpos(x,y,w,h)}" data-n="${n}">${n}${t?`<small class="tk">${esc(tk[n].name)}</small><small class="tt">${tk[n].time?fmtHM(tk[n].time):'시간 미정'}</small>`:on?`<small>${tseats[n]||0}명</small>`:''}</button>`;
  }).join('');
  drawSeats();
  const pax=+$('fPax').value||0,need=Math.ceil(pax/4),have=picked.length;
  const el=$('needTxt');
  if(!pax){el.innerHTML=have?`<span class="need">${have}개 선택 · ${seatSum()}명</span>`:'인원 입력 시 필요 수 표시';return}
  el.innerHTML=`<span class="need ${have>=need?'ok':'short'}">필요 ${need}개 · 선택 ${have}개</span>`;
}
$('cols').onclick=e=>{
  const b=e.target.closest('[data-n]');if(!b||!isAdmin)return;const n=+b.dataset.n;
  const go=()=>{
    if(picked.includes(n)){picked=picked.filter(x=>x!==n);delete tseats[n]}
    else{picked=picked.concat(n);if(tsManual){const left=(+$('fPax').value||0)-seatSum();tseats[n]=left>0?Math.min(4,left):4}}

  };

  else go();
};

/* ---------- 저장/처리 ---------- */
function upsert(sent){
  if(!isAdmin){toast('관리자 로그인 후 수정할 수 있어요');return}
  const f=form();let r;
  if(editingId&&(r=list.find(x=>x.id===editingId))){Object.assign(r,f);if(sent)r.sent=true}
  else{editingId='r'+Date.now();r=Object.assign({id:editingId,sent:!!sent},f);list.push(r)}
  save(KEY,list);cloudPut(r);refresh(true);
}
function cloudPut(r){
  if(!CLOUD||!db)return;
  const pub=Object.assign({},r);delete pub.id;delete pub.phone;
  pub.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
  db.collection(COL).doc(r.id).set(pub).catch(e=>toast('공유 저장 실패: '+(e.code||'')));
  db.collection(PCOL).doc(r.id).set({phone:r.phone||''}).catch(()=>{});
}
function cloudDel(id){
  if(!CLOUD||!db)return;
  db.collection(COL).doc(id).delete().catch(e=>toast('공유 삭제 실패: '+(e.code||'')));
  db.collection(PCOL).doc(id).delete().catch(()=>{});
}

$('btnDone').onclick=()=>{
  const r=list.find(x=>x.id===editingId);if(!r)return;
  ask('예약 처리',`<b>${esc(r.name)}</b> ${fmtShort(r.date)} 예약을 처리하면 목록에서 삭제됩니다.`,'처리',()=>{const id=editingId;list=list.filter(x=>x.id!==id);save(KEY,list);cloudDel(id);resetForm();toast('처리 완료')},true);
};

function resetForm(){
  editingId=null;picked=[];setting=[];lastAuto='';stopCd();curTpl='confirm';autoT={fSetT:30,fRcpT:10};po=newPO();tseats={};tsManual=false;
  ['fName','fPhone','fPax','fTime','fPre','fMemo','fSetT','fRcpT'].forEach(i=>$(i).value='');
  refresh();window.scrollTo({top:0,behavior:'smooth'});

function openResv(id,noScroll){
  const r=list.find(x=>x.id===id);if(!r)return;
  editingId=id;picked=r.tables.slice();setting=r.setting.slice();selDate=r.date;lastAuto=digits(r.phone);stopCd();
  const [y,m]=r.date.split('-').map(Number);view=new Date(y,m-1,1);
  $('fName').value=r.name;$('fPhone').value=fmtPhone(r.phone);$('fPax').value=r.pax;$('fTime').value=r.time;$('fPre').value=r.pre;$('fMemo').value=r.memo;
  $('fSetT').value=r.setT;$('fRcpT').value=r.rcpT;
  po=Object.assign(newPO(),r.po?JSON.parse(JSON.stringify(r.po)):{});
  if(r.tseats&&r.tsManual){tseats=Object.assign({},r.tseats);tsManual=true}else{tsManual=false;autoSeats()}
  autoT={fSetT:r.setT?null:30,fRcpT:r.rcpT?null:10};
  if(r.time&&r.setT&&shiftT(r.time,30)===r.setT)autoT.fSetT=30;
  if(r.time&&r.rcpT&&shiftT(r.time,10)===r.rcpT)autoT.fRcpT=10;
  if(!r.setT||!r.rcpT)applyAutoTimes();
  curTpl=r.sent?(r.date>today?'remind':'confirm'):'confirm';
  refresh();if(!noScroll)window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- 왼쪽 목차 ---------- */
document.querySelector('.seg').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;tocMode=b.dataset.f;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));drawToc()};
function drawToc(){
  let a=list.filter(r=>tocMode==='up'?r.date>=today:r.date<today);
  a.sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));if(tocMode==='past')a.reverse();
  if(!a.length){$('toc').innerHTML=`<div class="empty">${tocMode==='up'?'다가오는 예약이<br>없어요':'지난 예약이<br>없어요'}</div>`;return}
  let h='',cur='';
  a.forEach(r=>{

/* ---------- 직원 공유 ---------- */
function shareText(){
  const a=list.filter(r=>r.date>=today).sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));
  if(!a.length)return '';
  let t='[최우영고기야 단체예약]\n',cur='';
  a.forEach(r=>{
    if(r.date!==cur){cur=r.date;t+=`\n■ ${fmtDate(cur)}${cur===today?' (오늘)':''}\n`}
    t+=`- ${r.time?fmtTime(r.time):'시간 미정'} ${r.name} ${r.pax}명`+(r.tables.length?` / ${r.tseats?seatText(r):fmtTables(r.tables)}`:'')+'\n';
    if(r.setT||r.rcpT)t+=`  ⏰ 상차림 완료 ${fmtHM(r.setT)} · 🧾 주방 영수증 오더 ${fmtHM(r.rcpT)}\n`;
    poLines(r.po).forEach(l=>t+=`  ${l.label} ${fmtHM(l.time)} 세팅: ${l.text}\n`);
    if(r.setting.length)t+=`  상차림: ${r.setting.join(', ')}\n`;
    if(r.pre)t+=`  선주문: ${r.pre.replace(/\n/g,' ')}\n`;

  return t.trim();
}
// 직원 공유: 예약 목록 글 + 지금 열린 예약(없으면 가장 가까운 예약)의 세팅표·테이블 배치 이미지 자동 첨부
$('btnShare').onclick=async()=>{

};

/* ---------- 세팅표 (이미지) ---------- */
const NAVY='#14213d',GOLD='#b8892c',BEIGE='#f1e7d3',CARD='#f3ebdc';
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2)}
function wrap(c,text,maxW){
  const out=[];
  String(text).split('\n').forEach(p=>{
    let line='';
    p.split(' ').forEach(w=>{
      const t=line?line+' '+w:w;
      if(c.measureText(t).width<=maxW||!line){line=t}else{out.push(line);line=w}
      while(c.measureText(line).width>maxW&&line.length>1){let i=line.length;while(i>1&&c.measureText(line.slice(0,i)).width>maxW)i--;out.push(line.slice(0,i));line=line.slice(i)}
    });
    out.push(line);
  });
  return out;
}
function plate(c,x,y,r){
  circ(c,x,y,r);c.fillStyle='#fff';c.fill();c.lineWidth=r*.09;c.strokeStyle='#4b4b4b';c.stroke();
  circ(c,x,y,r*.68);c.lineWidth=r*.08;c.strokeStyle='#c99a2e';c.stroke();
  circ(c,x+r*.12,y+r*.12,r*.36);c.fillStyle='#f3d6a4';c.fill();c.lineWidth=r*.06;c.strokeStyle='#c99a2e';c.stroke();
}
function towel(c,x,y,w,h){rr(c,x-w/2,y-h/2,w,h,h*.18);c.fillStyle='#b9cdf2';c.fill();c.lineWidth=h*.08;c.strokeStyle='#2c5bb8';c.stroke();c.beginPath();c.moveTo(x+w*.3,y-h*.25);c.lineTo(x+w*.3,y+h*.25);c.stroke()}
// 세로로 세운 물티슈 (가로 테이블용)
function towelV(c,x,y,w,h){c.save();c.translate(x,y);c.rotate(Math.PI/2);towel(c,0,0,w,h);c.restore()}
function grill(c,x,y,r){
  circ(c,x,y,r);c.fillStyle='#d6d6d6';c.fill();c.lineWidth=r*.05;c.strokeStyle='#8a8a8a';c.stroke();
  c.save();c.setLineDash([r*.12,r*.08]);circ(c,x,y,r*.72);c.strokeStyle='#666';c.lineWidth=r*.035;c.stroke();c.restore();
  c.fillStyle=NAVY;c.textAlign='center';c.font=`900 ${r*.34}px "Noto Sans KR"`;c.fillText('불판',x,y+r*.12);
}
function seatsFor(tables,pax){const n=tables.length||1;let left=+pax||n*4;return Array.from({length:n},(_,i)=>{const s=Math.min(4,Math.max(0,i===n-1?left:Math.min(4,left)));left-=s;return s||4})}
let setOrient=load('gogiya_orient_v1','auto'); // auto | v | h
function orientOf(t){if(setOrient==='v'||setOrient==='h')return setOrient;return t>=12?'v':'h'}
function groupHead(c,W,P,y,title,sub,tip){
  c.textAlign='left';c.fillStyle=NAVY;c.font='900 38px "Noto Sans KR"';c.fillText(title,P,y+40);
  const tw=c.measureText(title).width;c.fillStyle='#8d6516';c.font='700 28px "Noto Sans KR"';c.fillText(sub,P+tw+18,y+40);
  y+=58;
  c.font='500 26px "Noto Sans KR"';const ls=wrap(c,tip,W-2*P-28);
  rr(c,P-14,y,W-2*P+28,ls.length*36+24,16);c.fillStyle='#eef3fb';c.fill();
  c.fillStyle='#2c4a7a';ls.forEach((l,i)=>c.fillText(l,P+6,y+42+i*36));
  y+=ls.length*36+24+26;c.textAlign='center';
  return y;
}
function numBadge(c,x,y,r,txt){circ(c,x,y,r);c.fillStyle=NAVY;c.fill();c.fillStyle='#fff';c.textAlign='center';c.font=`900 ${r*(String(txt).length>2?.7:1.05)}px "Noto Sans KR"`;c.fillText(txt,x,y+r*.37)}
// 테이블 옆 인원 표시 (4명 초과 시 의자 추가 안내)
function extraNote(c,x,y,n,align){
  c.textAlign=align;c.font='900 28px "Noto Sans KR"';c.fillStyle='#8d6516';
  c.fillText(n>4?`${n}명 (의자 +${n-4})`:`${n}명`,x,y+10);c.textAlign='center';
}
function seatMark(c,x,y,w,h){rr(c,x-w/2,y-h/2,w,h,h/2);c.fillStyle='#d9cdb4';c.fill();c.fillStyle='#7a6a4a';c.font=`700 ${h*.6}px "Noto Sans KR"`;c.textAlign='center';c.fillText('손님',x,y+h*.22)}
function drawVCards(c,W,P,y,list,seatOf,k){
  const n=list.length,cols=n<=3?n:n<=8?4:5,gap=26;
  const cw=Math.min(300,(W-2*P-gap*(cols-1))/cols),ch=cw*2.25,rad=cw*.16;
  let endY=y;
  list.forEach((t,i)=>{
    const row=Math.floor(i/cols),inRow=Math.min(cols,n-row*cols),col=i%cols;
    const totalW=inRow*cw+(inRow-1)*gap,x0=(W-totalW)/2+col*(cw+gap),y0=y+row*(ch+rad*2+40);
    numBadge(c,x0+cw/2,y0+rad,rad,k?t:'4인');
    if(k)extraNote(c,x0+cw/2+rad+8,y0+rad,seatOf[t],'left');
    const ty=y0+rad*2+14;rr(c,x0,ty,cw,ch,cw*.07);c.fillStyle=CARD;c.fill();c.lineWidth=3;c.strokeStyle='#dccdb0';c.stroke();
    grill(c,x0+cw/2,ty+ch*.5,cw*.27);
    const pr=cw*.15,tw=cw*.27,th=cw*.13,s=k?seatOf[t]:4;
    [[.13,0],[.29,1],[.71,0],[.87,1]].forEach(([fy,alt],j)=>{
      if(j>=s)return;const yy=ty+ch*fy;
      if(!alt){plate(c,x0+cw*.2,yy,pr);towel(c,x0+cw*.78,yy,tw,th)}
      else{towel(c,x0+cw*.2,yy,tw,th);plate(c,x0+cw*.8,yy,pr)}
    });
    endY=Math.max(endY,ty+ch+40);
  });
  return endY;
}
// 가로 테이블: 긴 쪽 위·아래에 2명씩. 손님이 앉은 쪽에서 봤을 때 왼쪽 앞접시, 오른쪽 물티슈
function drawHCards(c,W,P,y,list,seatOf,k){
  const n=list.length,cols=n<=3?1:2,gap=30,badge=44;
  const slot=(W-2*P-gap*(cols-1))/cols,cw=Math.min(720,slot-badge*2-16),ch=cols===1?cw*.42:cw*.5;
  const mark=Math.max(26,ch*.13),rowH=ch+mark*2+36;
  let endY=y;
  list.forEach((t,i)=>{
    const row=Math.floor(i/cols),inRow=Math.min(cols,n-row*cols),col=i%cols;
    const slotW=badge*2+16+cw,totalW=inRow*slotW+(inRow-1)*gap;
    const sx=(W-totalW)/2+col*(slotW+gap),x0=sx+badge*2+16,ty=y+row*rowH+mark+8;
    numBadge(c,sx+badge,ty+ch/2,badge,k?t:'4인');
    if(k)extraNote(c,sx,ty+ch/2+badge+30,seatOf[t],'left');
    rr(c,x0,ty,cw,ch,ch*.12);c.fillStyle=CARD;c.fill();c.lineWidth=3;c.strokeStyle='#dccdb0';c.stroke();
    grill(c,x0+cw/2,ty+ch/2,ch*.3);
    const pr=Math.min(ch*.15,cw*.065),tw=pr*1.8,th=pr*.85,off=cw*.085,s=k?seatOf[t]:4;
    // 0,1 = 아래쪽 손님(위를 봄) / 2,3 = 위쪽 손님(아래를 봄)
    [[.25,'b'],[.75,'b'],[.25,'t'],[.75,'t']].forEach(([fx,side],j)=>{
      if(j>=s)return;const cx=x0+cw*fx;
      if(side==='b'){plate(c,cx-off,ty+ch*.76,pr);towelV(c,cx+off,ty+ch*.74,tw,th);seatMark(c,cx,ty+ch+mark*.75,cw*.16,mark)}
      else{towelV(c,cx-off,ty+ch*.26,tw,th);plate(c,cx+off,ty+ch*.24,pr);seatMark(c,cx,ty-mark*.75,cw*.16,mark)}
    });
    endY=Math.max(endY,ty+ch+mark+40);
  });
  return endY;
}
async function buildSetupImage(f){
  try{await document.fonts.ready}catch(e){}
  const W=1024,P=40,cv=document.createElement('canvas');cv.width=W;cv.height=6000;
  const c=cv.getContext('2d');c.fillStyle='#fbf8f2';c.fillRect(0,0,W,cv.height);
  const tables=f.tables.slice().sort((a,b)=>a-b),k=tables.length,pax=+f.pax||0;

  c.fillText(k?`${pax||k*4}명 · ${k}테이블 세팅`:'테이블 세팅 기준',W/2,y+60);y+=90;

    c.fillStyle=NAVY;c.fillText(chip,W/2,y+48);y+=100;
  }else y+=20;
  if(f.time||f.setT||f.rcpT){
    const bh=150;rr(c,P-14,y,W-2*P+28,bh,24);c.fillStyle=NAVY;c.fill();
    const cells=[['⏰ 상차림 완료',f.setT,'#e0b552'],['🧾 주방 영수증 오더',f.rcpT,'#e0b552'],['👥 손님 도착',f.time,'#ffffff']];
    const cw3=(W-2*P+28)/3;
    cells.forEach(([lab,t,col],i)=>{
      const cx=P-14+cw3*i+cw3/2;
      c.fillStyle='#c9d2e6';c.font='700 28px "Noto Sans KR"';c.fillText(lab,cx,y+50);
      c.fillStyle=col;c.font='900 62px "Noto Sans KR"';c.fillText(fmtHM(t),cx,y+122);
      if(i<2){c.strokeStyle='rgba(255,255,255,.18)';c.lineWidth=2;c.beginPath();c.moveTo(P-14+cw3*(i+1),y+26);c.lineTo(P-14+cw3*(i+1),y+bh-26);c.stroke()}
    });

  }
  // 테이블 카드 — 1~11번 가로, 12~16번 세로 (세팅표 화면에서 바꿀 수 있음)
  const seatArr=seatsFor(tables,pax),seatOf={};tables.forEach((t,i)=>seatOf[t]=(f.tseats&&f.tseats[t]!=null)?f.tseats[t]:seatArr[i]);
  let vList,hList;
  if(k){vList=tables.filter(t=>orientOf(t)==='v');hList=tables.filter(t=>orientOf(t)==='h')}
  else{vList=setOrient==='h'?[]:['세로'];hList=setOrient==='v'?[]:['가로']}
  if(vList.length){y=groupHead(c,W,P,y,'세로 테이블',k?vList.map(t=>t+'번').join(' · '):'12~16번 벽소파 라인',SETUP_RULES.vTip);y=drawVCards(c,W,P,y,vList,seatOf,k)}
  if(hList.length){y=groupHead(c,W,P,y,'가로 테이블',k?hList.map(t=>t+'번').join(' · '):'1~11번 홀',SETUP_RULES.hTip);y=drawHCards(c,W,P,y,hList,seatOf,k)}

  const lh=230;rr(c,P-14,y,W-2*P+28,lh,24);c.fillStyle='#f4ecdd';c.fill();

  // 유리잔
  c.beginPath();c.moveTo(cx[1]-34,y+22);c.lineTo(cx[1]+34,y+22);c.lineTo(cx[1]+26,y+104);c.lineTo(cx[1]-26,y+104);c.closePath();
  c.fillStyle='#f6dfb5';c.fill();c.lineWidth=5;c.strokeStyle='#c99a2e';c.stroke();
  circ(c,cx[1],y+76,18);c.fillStyle='#fbeed3';c.fill();c.lineWidth=4;c.stroke();
  towel(c,cx[2],y+62,84,44);
  c.fillStyle=NAVY;c.font='900 27px "Noto Sans KR"';
  [SETUP_RULES.left,SETUP_RULES.mid,SETUP_RULES.right].forEach((t,i)=>{const ls=wrap(c,t,W*.3);ls.forEach((l,j)=>c.fillText(l,cx[i],y+150+j*34))});
  c.strokeStyle='#ddd0b6';c.lineWidth=2;[W*.36,W*.68].forEach(x=>{c.beginPath();c.moveTo(x,y+24);c.lineTo(x,y+lh-24);c.stroke()});
  y+=lh+24;
  // 단계 + 상차림 정보
  const steps=SETUP_RULES.steps.map((s,i)=>i===0&&pax?`${s} (${pax}명)`:s);
  const extra=[];
  poLines(f.po).forEach(l=>extra.push(`${l.label.replace(/^\S+ /,'')} 선주문 ${fmtHM(l.time)} 세팅 — ${l.text}`));
  if(f.setting.length)extra.push('상차림: '+f.setting.join(', '));

  c.textAlign='left';
  items.forEach(it=>{
    c.font='900 34px "Noto Sans KR"';const ls=wrap(c,it.t,W-2*P-150);const bh=Math.max(100,40+ls.length*44);
    rr(c,P-14,y,W-2*P+28,bh,20);c.fillStyle='#fff';c.fill();c.lineWidth=3;c.strokeStyle='#d9d1c0';c.stroke();

}

function setupText(f){
  const t=f.tables.length?seatText(f):'미지정';
  let s=`[세팅 지시] ${f.name||''} ${f.date?fmtDate(f.date):''} ${f.time?fmtTime(f.time):''}\n${f.pax||'?'}명 · 테이블 ${t}\n`;
  s+=`⏰ 상차림 완료 ${fmtHM(f.setT)}\n🧾 주방 영수증 오더 ${fmtHM(f.rcpT)}\n👥 손님 도착 ${fmtHM(f.time)}\n`;
  poLines(f.po).forEach(l=>s+=`${l.label} ${fmtHM(l.time)} 세팅: ${l.text}\n`);
  s+='\n';
  s+=`- ${SETUP_RULES.left}\n- ${SETUP_RULES.mid}\n- ${SETUP_RULES.right}\n`;
  SETUP_RULES.steps.forEach((x,i)=>s+=`${i+1}. ${x}\n`);
  if(f.setting.length)s+=`상차림: ${f.setting.join(', ')}\n`;
  if(f.pre)s+=`선주문: ${f.pre}\n`;
  if(f.memo)s+=`메모: ${f.memo}\n`;
  return s.trim();
}
$('btnSetCard').onclick=openSetup;$('btnSetHead').onclick=openSetup;

/* 직원과 테이블 지정 논의용: 배치 이미지 공유 */
const toFile=(cv,name)=>new Promise(r=>cv.toBlob(b=>r(new File([b],name.replace(/\s+/g,''),{type:'image/png'})),'image/png'));
async function shareFiles(files,text){
  if(!files.length){
    if(navigator.share){try{await navigator.share({text})}catch(e){}return}
    try{await navigator.clipboard.writeText(text);toast('복사했어요. 카톡에 붙여넣기 하세요')}catch(e){modal(`<h3>직원 공유</h3><textarea class="in" style="min-height:220px">${esc(text)}</textarea>`)}
    return;
  }
  if(navigator.canShare&&navigator.canShare({files})){try{await navigator.share({files,text})}catch(e){}return}
  const urls=await Promise.all(files.map(f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})));
  fallbackModal('📢 직원 공유',urls,'① 이미지를 <b>길게 눌러 저장</b> ② 글 복사 → 카톡에 이미지와 함께 보내기','',text);
}
function floorText(f){
  let s=`[테이블 배치] ${f.name||''} ${f.date?fmtDate(f.date):''} ${f.time?fmtTime(f.time):''}\n${f.pax||'?'}명 · ${f.tables.length?seatText(f):'테이블 미지정'}\n`;
  s+=`⏰ 상차림 ${fmtHM(f.setT)} · 🧾 주방 영수증 오더 ${fmtHM(f.rcpT)}\n`;
  const oth=list.filter(r=>r.date===f.date&&r.id!==editingId&&r.tables&&r.tables.length);
  if(oth.length)s+='\n같은 날 다른 예약:\n'+oth.map(r=>`- ${r.time?fmtHM(r.time)+' ':''}${r.name} ${fmtTables(r.tables)}`).join('\n')+'\n';
  s+='\n자리 의견 있으면 답장 주세요.';
  return s;
}
$('btnFloorShare').onclick=async()=>{
  const f=form();
  if(!f.tables.length){toast('테이블을 먼저 선택해주세요');return}
  const file=await toFile(buildFloorImage(f,true),`테이블배치_${f.name||''}_${f.date}.png`);
  shareFiles([file],floorText(f));
};

/* ---------- 문구 수정 ---------- */
const TPL_KEYS=['단체명','날짜','시간','인원','테이블','상차림'];
function tplCheck(text){
  const errs=[],bad=new Set();
  (text.match(/\{[^{}\n]*\}/g)||[]).forEach(t=>{const k=t.slice(1,-1).trim();if(!TPL_KEYS.includes(k))bad.add(t)});
  bad.forEach(t=>errs.push(`${t} 는 없는 칸이에요`));
  text.split('\n').forEach((l,i)=>{const o=(l.match(/\{/g)||[]).length,c=(l.match(/\}/g)||[]).length;if(o!==c)errs.push(`${i+1}번째 줄: 괄호 { } 짝이 안 맞아요`)});
  return {errs,bad};
}
function tplPreviewHTML(text){
  const {bad}=tplCheck(text);
  let h=esc(renderMsg(text,form()));
  bad.forEach(t=>{h=h.split(esc(t)).join(`<mark style="background:#ffd6d6;color:#c0392b;font-weight:900">${esc(t)}</mark>`)});
  return h;
}
$('btnTpl').onclick=()=>{
  modal(`<h3>${tpls[curTpl].name} 문구 수정</h3>
  <div class="chips" style="margin-bottom:8px">${TPL_KEYS.map(k=>`<button class="chip" data-ins="{${k}}">{${k}}</button>`).join('')}</div>
  <textarea class="in" id="tplEdit" style="min-height:130px;max-height:30vh">${esc(tpls[curTpl].text)}</textarea>
  <div id="tplErr" style="font-size:12.5px;color:#c0392b;font-weight:700;margin:6px 2px 0;line-height:1.5"></div>
  <div style="font-size:12px;color:var(--sub);font-weight:700;margin:10px 2px 4px">👀 손님이 받는 문자 미리보기</div>
  <div class="preview" id="tplPrev" style="max-height:30vh;overflow-y:auto"></div>
  <div class="mrow"><button class="btn ghost" style="flex:1;padding:12px" id="tplReset">기본값</button><button class="btn save" style="flex:1" id="tplSave">저장</button></div>`,(m,close)=>{
    const ta=m.querySelector('#tplEdit');
    const upd=()=>{const {errs}=tplCheck(ta.value);m.querySelector('#tplErr').innerHTML=errs.length?'⚠️ '+errs.map(esc).join('<br>⚠️ '):'';m.querySelector('#tplPrev').innerHTML=tplPreviewHTML(ta.value)};
    ta.addEventListener('input',upd);upd();
    m.querySelector('.chips').onclick=e=>{const b=e.target.closest('[data-ins]');if(!b)return;const s=ta.selectionStart??ta.value.length,en=ta.selectionEnd??s;ta.value=ta.value.slice(0,s)+b.dataset.ins+ta.value.slice(en);ta.focus();ta.selectionStart=ta.selectionEnd=s+b.dataset.ins.length;upd()};
    m.querySelector('#tplReset').onclick=()=>{ta.value=DEFAULT_TPL[curTpl].text;upd()};
    const doSave=()=>{tpls[curTpl]={name:tpls[curTpl].name,text:ta.value};const o={};Object.keys(tpls).forEach(k=>{if(tpls[k].text!==DEFAULT_TPL[k].text)o[k]=tpls[k]});save(TKEY,o);close();updateMsg();toast('문구 저장')};
    m.querySelector('#tplSave').onclick=()=>{
      const {errs}=tplCheck(ta.value);
      if(errs.length){m.querySelector('#tplErr').scrollIntoView({block:'center',behavior:'smooth'});toast('빨간 표시를 먼저 고쳐주세요');return}
      doSave();
    };
  });
};

/* 입력 중에는 하단 버튼줄을 숨겨 입력칸이 가려지지 않게 */
// 키보드가 실제로 열려 있을 때만 숨김 (키보드를 내리면 입력칸에 커서가 있어도 다시 보임)
let maxVH=0;
const isField=el=>!!(el&&el.matches&&el.matches('input:not([type=checkbox]),textarea'));
function kbCheck(){
  const h=window.visualViewport?window.visualViewport.height:window.innerHeight;
  maxVH=Math.max(maxVH,h);
  document.body.classList.toggle('typing',isField(document.activeElement)&&h<maxVH*0.78);
}
if(window.visualViewport)window.visualViewport.addEventListener('resize',kbCheck);
window.addEventListener('resize',kbCheck);
document.addEventListener('focusin',e=>{
  if(!isField(e.target))return;
  setTimeout(()=>{kbCheck();try{e.target.scrollIntoView({block:'center',behavior:'smooth'})}catch(x){}},350);
});
document.addEventListener('focusout',()=>setTimeout(kbCheck,150));
kbCheck();

/* ---------- 공통 ---------- */
['fName','fPre','fMemo'].forEach(i=>$(i).addEventListener('input',updateMsg));
$('fPax').addEventListener('input',e=>{e.target.value=digits(e.target.value);autoSeats();drawFloor();updateMsg()});
$('fTime').addEventListener('input',()=>{applyAutoTimes();drawTimes();updateMsg()});

function refresh(keepScroll){
  drawCal();drawTimes();drawTpls();drawFloor();drawSet();drawPO();drawToc();updateMsg();drawTimeChips();drawTimeline();
  const r=editingId&&list.find(x=>x.id===editingId);
  $('editBar').classList.toggle('show',!!r);$('editName').textContent=r?(isAdmin?'✏️ '+r.name+' 수정 중':'📋 '+r.name+' 예약 보기'):'';
  $('btnDone').classList.toggle('show',!!r);
}

/* ---------- 공유 모드 (Firestore) ---------- */
function setStatus(txt,color){$('statusTxt').textContent=txt;$('statusDot').style.background=color}
function setMode(){
  document.body.classList.toggle('view',!isAdmin);
  document.querySelectorAll('main input,main textarea').forEach(el=>el.readOnly=!isAdmin);
  $('btnAdmin').textContent=isAdmin?'🔓':'🔒';
  refresh();
}
function openFirstUpcoming(){const a=list.filter(r=>r.date>=today).sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));if(a.length)openResv(a[0].id)}
function loginModal(){
  if(isAdmin){ask('관리자 로그아웃','로그아웃하면 보기 전용으로 바뀝니다.','로그아웃',()=>auth.signOut());return}
  modal(`<h3>🔒 관리자 로그인</h3><p style="font-size:13px">관리자만 예약을 추가·수정할 수 있어요.</p>
  <input class="in" id="lgEmail" type="email" placeholder="이메일" autocomplete="username" style="margin-bottom:8px">
  <input class="in" id="lgPw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <div class="mrow"><button class="btn ghost" style="flex:1;padding:12px" data-x>취소</button><button class="btn save" style="flex:1" id="lgGo">로그인</button></div>`,(m,close)=>{
    m.querySelector('[data-x]').onclick=close;
    m.querySelector('#lgGo').onclick=async()=>{
      try{await auth.signInWithEmailAndPassword(m.querySelector('#lgEmail').value.trim(),m.querySelector('#lgPw').value);close();toast('관리자 모드')}
      catch(e){toast(/password|credential|user/.test(e.code||'')?'이메일 또는 비밀번호가 맞지 않아요':'로그인 실패: '+(e.code||''))}
    };
  });
}
if(CLOUD){
  firebase.initializeApp(CFG);db=firebase.firestore();auth=firebase.auth();
  $('btnAdmin').hidden=false;$('btnAdmin').onclick=loginModal;
  setStatus('연결 중…','#f0b429');
  db.collection(COL).onSnapshot(s=>{
    const remote=[];s.forEach(d=>remote.push(norm(Object.assign({id:d.id},d.data()))));
    remote.forEach(r=>{r.phone=privMap[r.id]||''});
    remoteCount=remote.length;list=remote;save(KEY,list);
    setStatus('실시간 공유 중','#3ddc84');
    if(editingId&&!list.find(x=>x.id===editingId)){resetForm();return}
    if(firstSnap&&!isAdmin&&!editingId){firstSnap=false;openFirstUpcoming();return}
    firstSnap=false;
    if(editingId&&!isAdmin)openResv(editingId,true);else refresh();
    maybeUpload();
  },e=>setStatus(e.code==='permission-denied'?'공유 권한 오류 (규칙 확인)':'연결 오류','#ff6b6b'));
  auth.onAuthStateChanged(u=>{
    isAdmin=!!u;
    if(unsubP){unsubP();unsubP=null}
    privMap={};list.forEach(r=>r.phone='');
    if(u){
      unsubP=db.collection(PCOL).onSnapshot(s=>{
        privMap={};s.forEach(d=>privMap[d.id]=d.data().phone||'');
        list.forEach(r=>r.phone=privMap[r.id]||'');
        if(editingId&&document.activeElement!==$('fPhone')){const r=list.find(x=>x.id===editingId);if(r)$('fPhone').value=fmtPhone(r.phone)}
        updateMsg();
      },()=>{});
    }else if(editingId){$('fPhone').value=''}
    setMode();maybeUpload();
  });
}else{
  setStatus('이 휴대폰에만 저장','#9aa');
}
// 처음 공유 연결 시: 이 휴대폰에 있던 예약을 올릴지 묻기 (한 번만)
let uploadAsked=false;
function maybeUpload(){
  if(!CLOUD||!isAdmin||uploadAsked||remoteCount!==0)return;
  const seed=localSeed.filter(r=>r.date>=today);if(!seed.length)return;
  uploadAsked=true;
  ask('예약 올리기',`이 휴대폰에 저장돼 있던 다가오는 예약 ${seed.length}건을 공유 목록에 올릴까요?`,'올리기',()=>{seed.forEach(cloudPut);toast(seed.length+'건 올렸어요')});
}
setMode();
})();
</script>

document.getElementById('installHelp').showModal();
});
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
